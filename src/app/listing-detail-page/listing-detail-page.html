<div class="content-box">
    <a routerLink="/listings">
        <button>Back to Listings</button>
    </a>
    @if (listing) {
    <h1>{{ listing.name }}</h1>
    <p>{{ listing.description }}</p>
    <p>{{ listing.price | currency }}</p>
    <a routerLink="/contact/{{ listing.id }}">
        <button>Contact Seller</button>
    </a>
    }
</div>
